<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != '/' %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  {% if site.description %}<meta name="description" content="{{ page.summary | default: site.description | strip_html | truncate: 160 }}">{% endif %}
  <link rel="icon" href="{{ site.avatar | relative_url }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/vs2015.min.css">
  {% assign v = site.time | date: '%s' %}
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v={{ v }}">
  <link rel="stylesheet" href="{{ '/assets/css/lecture.css' | relative_url }}?v={{ v }}">
</head>
<body class="{{ page.body_class | default: layout.body_class | default: 'page' }}">
  <a class="skip" href="#content">본문으로 건너뛰기</a>
  <header class="topbar">
    <button class="icon-btn menu-btn" type="button" aria-label="메뉴 열기" aria-controls="sidebar" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <a class="topbar-brand" href="{{ '/' | relative_url }}"><img src="{{ site.avatar | relative_url }}" alt=""><span>{{ site.title }}</span></a>
    <button class="icon-btn search-open" type="button" aria-label="글 검색" aria-controls="search">
      <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </header>
  {% include sidebar.html %}
  <div class="overlay" id="overlay"></div>
  <main class="main" id="content">
    {{ content }}
    <footer class="site-footer">
      <div class="wrap"><div class="foot-inner"><span>© {{ site.time | date: '%Y' }} {{ site.title }}</span><span>GitHub Pages로 만든 학습 노트</span></div></div>
    </footer>
  </main>
  {% include search.html %}
  <button class="to-top" type="button" aria-label="맨 위로">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="{{ '/assets/js/site.js' | relative_url }}?v={{ v }}"></script>
</body>
</html>
